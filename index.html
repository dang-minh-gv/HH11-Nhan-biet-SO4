<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thí Nghiệm Ảo: Nhận Biết Ion SO4(2-)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --speed-multiplier: 1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes dropFall {
            0% { transform: translateY(-30px); opacity: 0; }
            30% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(100px); opacity: 0; }
        }

        /* Bỏ hoàn toàn translateY để hạt KHÔNG BAO GIỜ bị đẩy ra khỏi tọa độ an toàn */
        @keyframes precipitateForm {
            0% { opacity: 0; }
            100% { opacity: 0.9; }
        }

        @keyframes shakeTube {
            0%, 100% { transform: translateX(0) rotate(0); }
            20% { transform: translateX(-10px) rotate(-5deg); }
            40% { transform: translateX(10px) rotate(5deg); }
            60% { transform: translateX(-10px) rotate(-5deg); }
            80% { transform: translateX(10px) rotate(5deg); }
        }

        /* Chỉ làm mờ, không đẩy hạt rơi thêm để tránh lỗi tràn viền */
        @keyframes settlePrecipitate {
            0% { opacity: 0.9; }
            100% { opacity: 0; } 
        }

        .anim-drop {
            animation: dropFall calc(1s * var(--speed-multiplier)) ease-in forwards;
        }

        .anim-precipitate {
            animation: precipitateForm calc(2s * var(--speed-multiplier)) ease-in-out forwards;
        }
        
        .anim-shake {
            animation: shakeTube calc(0.8s * var(--speed-multiplier)) ease-in-out infinite;
        }

        .anim-settle {
            animation: settlePrecipitate calc(1.5s * var(--speed-multiplier)) ease-in-out forwards;
        }

        /* Tool states */
        .tool-selected {
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.5);
            transform: translateY(-5px);
            border-color: #3b82f6;
        }
        
        .cursor-pointer-hover:hover {
            filter: brightness(0.95);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen flex flex-col text-gray-800">

    <!-- Header -->
    <header class="bg-[#1e3a8a] text-white py-1.5 px-3 md:px-4 shadow-md z-20 flex justify-between items-center shrink-0">
        <!-- Đã bỏ class uppercase ở h1 để giữ nguyên định dạng của chữ a trong Ba2+ -->
        <h1 class="text-sm md:text-lg lg:text-xl font-bold tracking-wide flex items-center">
            <svg class="w-5 h-5 md:w-6 md:h-6 mr-2 text-blue-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            <span class="truncate">THÍ NGHIỆM ẢO: NHẬN BIẾT ION SO₄²⁻ BẰNG ION Ba²⁺</span>
        </h1>
        <div class="flex items-center space-x-2 md:space-x-4 shrink-0">
            <!-- Speed Control -->
            <div class="flex items-center space-x-1 bg-blue-900 rounded-lg p-1 border border-blue-700 hidden sm:flex">
                <button onclick="setSpeed(2)" id="btn-speed-slow" class="px-2 py-1 text-xs rounded hover:bg-blue-700 opacity-50" title="Chậm">🐢</button>
                <button onclick="setSpeed(1)" id="btn-speed-norm" class="px-2 py-1 text-xs rounded bg-blue-600 shadow" title="Bình thường">▶</button>
                <button onclick="setSpeed(0.5)" id="btn-speed-fast" class="px-2 py-1 text-xs rounded hover:bg-blue-700 opacity-50" title="Nhanh">⚡</button>
            </div>
            <!-- Restart Button -->
            <button onclick="resetExperiment()" class="flex items-center text-xs bg-red-700 hover:bg-red-600 px-3 py-1.5 rounded border border-red-500 transition-colors ml-2 text-white shadow-sm" title="Khởi tạo lại toàn bộ">
                🔄 Làm lại từ đầu
            </button>
        </div>
    </header>

    <!-- Progress Bar -->
    <div class="bg-white border-b border-gray-200 py-1 md:py-1.5 px-2 md:px-4 shadow-sm z-10 shrink-0">
        <div class="flex items-center justify-between w-full max-w-5xl mx-auto" id="progress-container">
            <!-- Steps injected by JS -->
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden bg-[#e2e8f0]">
        
        <!-- Left Panel: Experiment & Tools (60%) -->
        <div class="w-full md:w-[55%] lg:w-[60%] flex flex-col relative h-full overflow-hidden">
            
            <!-- Message Overlay -->
            <div id="lab-message" class="absolute top-4 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-lg shadow-lg text-sm font-semibold opacity-0 transition-opacity duration-300 pointer-events-none z-50 text-center max-w-sm"></div>

            <!-- Experiment Area (Top) -->
            <div class="flex-1 bg-slate-800 relative flex justify-center items-center m-2 md:m-3 rounded-xl shadow-inner border border-slate-700 overflow-hidden min-h-[200px]">
                
                <!-- Zoom linh hoạt: Tự động thu nhỏ ống nghiệm trên màn hình hẹp -->
                <div class="relative w-[280px] h-[320px] flex justify-center items-end pb-4 scale-[0.65] sm:scale-[0.75] md:scale-[0.85] lg:scale-95 origin-center transition-transform">
                    
                    <!-- Kẹp gỗ (Phần cán và ngàm sau) -->
                    <svg class="absolute top-[130px] left-1/2 transform -translate-x-[165px] w-[150px] h-[40px] z-0" viewBox="0 0 150 40">
                        <rect x="0" y="15" width="115" height="10" fill="#b45309" rx="3"/>
                        <path d="M 110 10 Q 135 10 145 15 L 145 25 Q 135 30 110 30 Z" fill="#78350f"/>
                    </svg>

                    <!-- Ống nghiệm -->
                    <div class="relative z-10 flex flex-col items-center cursor-pointer group h-[240px] justify-end" id="main-tube" onclick="handleTubeClick()">
                        
                        <!-- Pipette Anim -->
                        <div id="pipette-anim" class="absolute -top-[90px] left-1/2 transform -translate-x-1/2 hidden z-40 transition-transform duration-500">
                            <svg width="24" height="80" viewBox="0 0 24 80">
                                <path d="M 12 0 C 20 0, 20 16, 12 24 L 10 75 L 14 75 L 12 24 C 4 16, 4 0, 12 0 Z" fill="rgba(255,255,255,0.8)" stroke="#cbd5e1" stroke-width="2"/>
                                <circle cx="12" cy="12" r="7" id="pipette-bulb" fill="#ef4444"/>
                                <rect x="11" y="24" width="2" height="45" id="pipette-liquid" fill="transparent"/>
                            </svg>
                        </div>

                        <!-- Giọt nước Anim -->
                        <div id="drops-anim" class="absolute -top-8 left-1/2 transform -translate-x-1/2 w-6 h-16 hidden z-30"></div>

                        <!-- SVG Ống nghiệm -->
                        <svg width="54" height="245" viewBox="0 0 54 245" class="overflow-visible drop-shadow-2xl z-20 transition-transform" id="tube-svg">
                            <!-- Miệng ống sau -->
                            <ellipse cx="27" cy="14" rx="20" ry="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
                            
                            <!-- Dung dịch Na2SO4 -->
                            <rect id="liquid-content" x="9" y="238" width="36" height="0" rx="18" fill="rgba(255,255,255,0.15)" opacity="1" style="transition: all 1s ease;"/>
                            
                            <!-- Lớp vẩn đục toàn phần (Màu trắng sữa) -->
                            <rect id="cloudy-liquid" x="9" y="130" width="36" height="108" rx="18" fill="#f8fafc" opacity="0" style="transition: opacity 2s ease;"/>
                            
                            <!-- Kết tủa đặc lắng xuống đáy vẽ bằng path khớp 100% với đáy thủy tinh -->
                            <path id="settled-precipitate" d="M 9 205 L 9 220 A 18 18 0 0 0 45 220 L 45 205 Z" fill="#f8fafc" opacity="0" style="transition: opacity 2s ease;"/>

                            <!-- Hạt kết tủa trắng -->
                            <g id="precipitate-group" opacity="0">
                                <!-- Hạt được thêm bằng JS -->
                            </g>
                            
                            <!-- Thân ống thủy tinh -->
                            <path d="M 7 14 L 7 220 A 20 20 0 0 0 47 220 L 47 14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
                            <!-- Miệng ống trước -->
                            <path d="M 7 14 A 20 6 0 0 0 47 14" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
                        </svg>
                    </div>

                    <!-- Kẹp gỗ (Phần ngàm trước) -->
                    <svg class="absolute top-[130px] left-1/2 transform -translate-x-[25px] w-[50px] h-[40px] z-30 pointer-events-none" viewBox="0 0 50 40">
                        <path d="M 0 12 Q 25 12 35 15 L 35 25 Q 25 28 0 28 Z" fill="#92400e"/>
                        <rect x="-10" y="10" width="8" height="20" fill="#94a3b8" rx="2"/>
                        <path d="M 0 14 Q 20 14 30 16 L 30 18 Q 20 16 0 16 Z" fill="#fcd34d" opacity="0.3"/>
                    </svg>

                </div>
            </div>

            <!-- Tools Area (Bottom) -->
            <div class="h-24 lg:h-28 bg-white m-2 md:m-3 mt-0 rounded-xl shadow-sm border border-gray-300 flex items-center justify-center space-x-4 sm:space-x-8 lg:space-x-12 shrink-0 relative">
                <div class="absolute -top-3 left-4 text-[10px] md:text-[11px] font-bold text-gray-500 bg-white px-2 border border-gray-200 rounded">HÓA CHẤT & DỤNG CỤ</div>
                
                <!-- Na2SO4 Bottle -->
                <div class="flex flex-col items-center cursor-pointer p-2 rounded-xl hover:bg-gray-50 border-2 border-transparent transition-all scale-90 sm:scale-100" id="tool-na2so4" onclick="selectTool('na2so4')">
                    <svg width="50" height="70" viewBox="0 0 50 70">
                        <path d="M15 20 L 15 10 L 35 10 L 35 20 L 45 30 L 45 65 A 5 5 0 0 1 40 70 L 10 70 A 5 5 0 0 1 5 65 L 5 30 Z" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
                        <rect x="7" y="35" width="36" height="30" fill="#f0f9ff" opacity="0.8"/>
                        <rect x="10" y="38" width="30" height="18" fill="white" stroke="#cbd5e1" rx="2"/>
                        <text x="25" y="49" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Na₂SO₄</text>
                        <path d="M 18 10 L 18 5 A 7 7 0 0 1 32 5 L 32 10" fill="#0f172a" />
                    </svg>
                    <span class="text-xs mt-2 font-medium text-gray-700">D.dịch Na₂SO₄</span>
                </div>

                <!-- BaCl2 Bottle -->
                <div class="flex flex-col items-center cursor-pointer p-2 rounded-xl hover:bg-gray-50 border-2 border-transparent transition-all opacity-50 pointer-events-none scale-90 sm:scale-100" id="tool-bacl2" onclick="selectTool('bacl2')">
                    <svg width="50" height="70" viewBox="0 0 50 70">
                        <path d="M15 20 L 15 10 L 35 10 L 35 20 L 45 30 L 45 65 A 5 5 0 0 1 40 70 L 10 70 A 5 5 0 0 1 5 65 L 5 30 Z" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
                        <rect x="7" y="35" width="36" height="30" fill="#f0f9ff" opacity="0.8"/>
                        <rect x="10" y="38" width="30" height="18" fill="white" stroke="#cbd5e1" rx="2"/>
                        <text x="25" y="49" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">BaCl₂</text>
                        <path d="M 18 10 L 18 5 A 7 7 0 0 1 32 5 L 32 10" fill="#0f172a" />
                    </svg>
                    <span class="text-xs mt-2 font-medium text-gray-700">D.dịch BaCl₂</span>
                </div>

                <!-- Pipette Tool -->
                <div class="flex flex-col items-center p-2 scale-90 sm:scale-100">
                    <svg width="20" height="70" viewBox="0 0 20 70">
                        <path d="M 10 0 C 18 0, 18 15, 10 20 L 8 65 L 12 65 L 10 20 C 2 15, 2 0, 10 0 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
                        <circle cx="10" cy="10" r="6" fill="#ef4444"/>
                    </svg>
                    <span class="text-xs mt-2 font-medium text-gray-400">Ống nhỏ giọt</span>
                </div>
            </div>
        </div>

        <!-- Right Panel: Tasks & Instructions (40%) -->
        <div class="w-full md:w-[45%] lg:w-[40%] bg-white border-l border-gray-300 flex flex-col h-full shadow-[-4px_0_15px_rgba(0,0,0,0.03)] z-10">
            <div class="p-6 flex-1 overflow-y-auto" id="task-panel">
                <!-- Content injected by JS -->
            </div>
            
            <!-- Bottom Actions -->
            <div class="p-4 bg-gray-50 border-t border-gray-200 flex space-x-3 shrink-0">
                <button id="btn-action" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow transition-colors flex items-center justify-center opacity-50 cursor-not-allowed" disabled>
                    Tiếp tục
                </button>
                <button onclick="retryStep()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 p-2.5 rounded-lg shadow-sm transition-colors" title="Thực hiện lại bước này">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>

    </main>

    <script>
        const STEPS = [
            { id: 1, title: "Lấy Na₂SO₄" },
            { id: 2, title: "Nhỏ BaCl₂" },
            { id: 3, title: "Lắc nhẹ" },
            { id: 4, title: "Quan sát" },
            { id: 5, title: "Bài tập" },
            { id: 6, title: "Kết luận" }
        ];

        let state = {
            step: 1,
            speed: 1,
            selectedTool: null,
            tubeState: 'empty', 
            answers: {
                obs1: null, obs2: null, obs3: null,
                ex1: null, ex2: null, ex3: null, ex4: null, ex5: null,
                concl1: "", concl2: "", concl3: ""
            }
        };

        const DOM = {
            progress: document.getElementById('progress-container'),
            taskPanel: document.getElementById('task-panel'),
            btnAction: document.getElementById('btn-action'),
            msg: document.getElementById('lab-message'),
            tools: {
                na2so4: document.getElementById('tool-na2so4'),
                bacl2: document.getElementById('tool-bacl2')
            },
            tube: {
                main: document.getElementById('main-tube'),
                svg: document.getElementById('tube-svg'),
                liquid: document.getElementById('liquid-content'),
                cloudy: document.getElementById('cloudy-liquid'),
                precipGroup: document.getElementById('precipitate-group'),
                pipette: document.getElementById('pipette-anim'),
                drops: document.getElementById('drops-anim')
            }
        };

        const showMsg = (text, isError = false) => {
            DOM.msg.innerText = text;
            DOM.msg.className = `absolute top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-xl text-sm font-bold z-50 text-center max-w-sm transition-opacity duration-300 ${isError ? 'bg-red-100 text-red-700 border border-red-300' : 'bg-blue-100 text-blue-800 border border-blue-300'}`;
            DOM.msg.style.opacity = 1;
            setTimeout(() => DOM.msg.style.opacity = 0, 3000);
        };

        const setSpeed = (val) => {
            state.speed = val;
            document.documentElement.style.setProperty('--speed-multiplier', val);
            ['slow', 'norm', 'fast'].forEach(id => document.getElementById(`btn-speed-${id}`).classList.replace('opacity-100', 'opacity-50'));
            const map = {0.5: 'fast', 1: 'norm', 2: 'slow'};
            document.getElementById(`btn-speed-${map[val]}`).classList.replace('opacity-50', 'opacity-100');
        };

        const updateToolUI = () => {
            Object.values(DOM.tools).forEach(el => el.classList.remove('tool-selected'));
            if (state.selectedTool) DOM.tools[state.selectedTool].classList.add('tool-selected');

            DOM.tools.na2so4.classList.toggle('opacity-50', state.step !== 1);
            DOM.tools.na2so4.classList.toggle('pointer-events-none', state.step !== 1);
            DOM.tools.bacl2.classList.toggle('opacity-50', state.step !== 2);
            DOM.tools.bacl2.classList.toggle('pointer-events-none', state.step !== 2);
            
            DOM.tube.main.classList.toggle('cursor-pointer', state.step <= 3);
        };

        const selectTool = (tool) => {
            if (state.selectedTool === tool) state.selectedTool = null;
            else {
                state.selectedTool = tool;
                showMsg(`Đã chọn dung dịch ${tool === 'na2so4' ? 'Na₂SO₄' : 'BaCl₂'}`);
            }
            updateToolUI();
        };

        const handleTubeClick = () => {
            if (state.step === 1 && state.selectedTool === 'na2so4') {
                playPipetteAnim('na2so4');
            } else if (state.step === 2 && state.selectedTool === 'bacl2') {
                playPipetteAnim('bacl2');
            } else if (state.step === 3) {
                playShakeAnim();
            } else if (state.step <= 3 && !state.selectedTool) {
                if(state.step !== 3) showMsg("Hãy chọn hóa chất ở khay dụng cụ trước.", true);
            } else if (state.step <= 2) {
                showMsg("Chưa đúng thao tác. Hãy thực hiện theo hướng dẫn.", true);
            }
        };

        const playPipetteAnim = (type) => {
            state.selectedTool = null;
            updateToolUI();
            
            const pip = DOM.tube.pipette;
            const pipLiq = document.getElementById('pipette-liquid');
            
            pip.classList.remove('hidden');
            pipLiq.setAttribute('fill', type === 'na2so4' ? 'rgba(255,255,255,0.5)' : '#ffffff');
            
            setTimeout(() => {
                pip.style.transform = 'translate(-50%, 50px)';
            }, 100);

            setTimeout(() => {
                pipLiq.setAttribute('height', '0'); 
            
            if (type === 'na2so4') {
                DOM.tube.liquid.setAttribute('height', '108');
                DOM.tube.liquid.setAttribute('y', '130');
            } else {
                DOM.tube.drops.innerHTML = `
                        <svg viewBox="0 0 20 40"><circle cx="10" cy="5" r="3.5" fill="#ffffff" class="anim-drop" style="animation-delay: 0s"/></svg>
                        <svg viewBox="0 0 20 40"><circle cx="10" cy="5" r="3.5" fill="#ffffff" class="anim-drop" style="animation-delay: ${0.3 * state.speed}s"/></svg>
                        <svg viewBox="0 0 20 40"><circle cx="10" cy="5" r="3.5" fill="#ffffff" class="anim-drop" style="animation-delay: ${0.6 * state.speed}s"/></svg>
                    `;
                    DOM.tube.drops.classList.remove('hidden');

                    setTimeout(() => {
                        DOM.tube.cloudy.style.opacity = '0.95'; 
                        generateParticles();
                        DOM.tube.precipGroup.setAttribute('opacity', '1');
                    }, 500 * state.speed);
                }
            }, 800 * state.speed);

            setTimeout(() => {
                pip.style.transform = 'translate(-50%, 0)';
                setTimeout(() => pip.classList.add('hidden'), 500);
                
                state.tubeState = type === 'na2so4' ? 'na2so4' : 'reacting';
                showMsg(type === 'na2so4' ? "Đã thêm Na₂SO₄." : "Hãy quan sát hiện tượng!");
                unlockNext();
            }, 1800 * state.speed);
        };

        // HÀM TOÁN HỌC KHỐNG CHẾ HẠT KẾT TỦA 100% NẰM TRONG ỐNG
        const generateParticles = () => {
            const group = DOM.tube.precipGroup;
            group.innerHTML = '';
            let count = 0;
            
            while (count < 60) {
                const x = 11 + Math.random() * 32; 
                const y = 135 + Math.random() * 95; // Giới hạn Y tối đa
                const r = 1 + Math.random() * 2.5; 

                let isSafe = true;
                // Nếu hạt rơi xuống vùng cong của đáy (Y > 220), dùng phương trình đường tròn để chặn lại
                if (y > 220) {
                    const dx = x - 27; // Tâm X
                    const dy = y - 220; // Tâm Y
                    const maxDist = 18 - r - 0.5; // Bán kính trong trừ đi bán kính hạt
                    if (dx*dx + dy*dy > maxDist*maxDist) {
                        isSafe = false;
                    }
                }
                
                if (isSafe) {
                    group.innerHTML += `<circle cx="${x}" cy="${y}" r="${r}" fill="#ffffff" opacity="0.9" class="anim-precipitate" style="animation-delay: ${Math.random()*0.5}s"/>`;
                    count++;
                }
            }
        };

        const playShakeAnim = () => {
            DOM.tube.svg.classList.add('anim-shake');
            setTimeout(() => {
                DOM.tube.svg.classList.remove('anim-shake');
                
                DOM.tube.cloudy.style.opacity = '0.7'; 
                document.getElementById('settled-precipitate').style.opacity = '1';
                
                const circles = DOM.tube.precipGroup.querySelectorAll('circle');
                circles.forEach(c => {
                    c.style.animation = 'none';
                    c.classList.add('anim-settle');
                });

                state.tubeState = 'shaken';
                showMsg("Kết tủa đã lắng xuống một phần.");
                unlockNext();
            }, 1500 * state.speed);
        };

        const renderProgress = () => {
            DOM.progress.innerHTML = STEPS.map((s, idx) => {
                const isPast = s.id < state.step;
                const isCurr = s.id === state.step;
                const color = isCurr ? 'bg-blue-600 border-blue-600 text-white' : (isPast ? 'bg-green-500 border-green-500 text-white' : 'bg-gray-100 border-gray-300 text-gray-400');
                const line = idx < STEPS.length - 1 ? `<div class="h-1 flex-1 mx-1 rounded ${isPast ? 'bg-green-500' : 'bg-gray-200'}"></div>` : '';
                return `
                    <div class="flex items-center ${idx < STEPS.length - 1 ? 'flex-1' : ''}">
                        <div class="flex flex-col items-center shrink-0">
                            <div class="w-6 h-6 md:w-8 md:h-8 rounded-full border-2 flex items-center justify-center text-xs md:text-sm font-bold shadow-sm ${color}">
                                ${isPast ? '✓' : s.id}
                            </div>
                            <span class="text-[10px] md:text-xs mt-1 font-semibold ${isCurr?'text-blue-700':(isPast?'text-green-600':'text-gray-400')} hidden sm:block">${s.title}</span>
                        </div>
                        ${line}
                    </div>
                `;
            }).join('');
        };

        const renderTaskPanel = () => {
            let html = '';
            switch(state.step) {
                case 1:
                    html = `
                        <div class="fade-in">
                            <h2 class="text-xl font-bold text-blue-800 mb-3 border-b pb-2 border-blue-100">BƯỚC 1: LẤY DUNG DỊCH</h2>
                            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded text-gray-700 leading-relaxed shadow-sm">
                                <strong>Nhiệm vụ:</strong><br>
                                1. Nhấp chuột vào chai <strong>D.dịch Na₂SO₄</strong> ở khay hóa chất.<br>
                                2. Nhấp chuột vào <strong>ống nghiệm</strong> trên giá để nhỏ khoảng 1mL dung dịch vào ống.
                            </div>
                            <div class="mt-6 p-4 bg-gray-50 rounded border border-gray-200 text-sm text-gray-500 italic">
                                Trạng thái ống nghiệm: Trống.
                            </div>
                        </div>`;
                    if(state.tubeState === 'na2so4') unlockNext(); else lockNext();
                    DOM.btnAction.onclick = nextStep;
                    break;
                
                case 2:
                    html = `
                        <div class="fade-in">
                            <h2 class="text-xl font-bold text-blue-800 mb-3 border-b pb-2 border-blue-100">BƯỚC 2: THÊM THUỐC THỬ</h2>
                            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded text-gray-700 leading-relaxed shadow-sm">
                                <strong>Nhiệm vụ:</strong><br>
                                1. Chọn chai <strong>D.dịch BaCl₂</strong>.<br>
                                2. Nhỏ vài giọt vào ống nghiệm đang chứa Na₂SO₄.<br>
                                <span class="text-red-600 font-bold mt-2 block">Cực kỳ chú ý quan sát hiện tượng xảy ra ngay khi giọt BaCl₂ chạm mặt dung dịch!</span>
                            </div>
                        </div>`;
                    if(state.tubeState === 'reacting') unlockNext(); else lockNext();
                    DOM.btnAction.onclick = nextStep;
                    break;

                case 3:
                    html = `
                        <div class="fade-in">
                            <h2 class="text-xl font-bold text-blue-800 mb-3 border-b pb-2 border-blue-100">BƯỚC 3: LẮC ỐNG NGHIỆM</h2>
                            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded text-gray-700 leading-relaxed shadow-sm">
                                <strong>Nhiệm vụ:</strong><br>
                                Nhấp chuột trực tiếp vào <strong>ống nghiệm</strong> để lắc nhẹ, giúp phản ứng xảy ra hoàn toàn và quan sát trạng thái của chất tạo thành.
                            </div>
                        </div>`;
                    if(state.tubeState === 'shaken') unlockNext(); else lockNext();
                    DOM.btnAction.onclick = nextStep;
                    break;

                case 4:
                    html = `
                        <div class="fade-in">
                            <h2 class="text-xl font-bold text-blue-800 mb-3 border-b pb-2 border-blue-100">PHIẾU QUAN SÁT</h2>
                            <p class="mb-4 text-sm text-gray-600">Hãy ghi lại chính xác những gì em đã nhìn thấy bằng mắt thường.</p>
                            
                            <div class="space-y-4 bg-white p-4 rounded border shadow-sm">
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-1">Chất ban đầu trong ống:</label>
                                    <input type="text" id="obs1" class="w-full p-2 border rounded bg-gray-50 focus:ring-2 focus:ring-blue-400 outline-none" value="${state.answers.obs1 || ''}">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-1">Dung dịch thêm vào:</label>
                                    <input type="text" id="obs2" class="w-full p-2 border rounded bg-gray-50 focus:ring-2 focus:ring-blue-400 outline-none" value="${state.answers.obs2 || ''}">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Hiện tượng quan sát được:</label>
                                    <div class="space-y-2">
                                        ${['Không có hiện tượng', 'Xuất hiện kết tủa trắng', 'Xuất hiện khí', 'Dung dịch hóa xanh'].map((opt, i) => `
                                            <label class="flex items-center p-2 border rounded cursor-pointer hover:bg-gray-50 ${(state.answers.obs3===i) ? 'bg-blue-50 border-blue-400' : ''}">
                                                <input type="radio" name="obs_rad" value="${i}" class="mr-3" ${(state.answers.obs3===i) ? 'checked' : ''} onchange="state.answers.obs3=${i}; checkObs()">
                                                <span>${opt}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    DOM.btnAction.onclick = nextStep;
                    DOM.btnAction.innerText = "Lưu & Bắt đầu suy luận";
                    if(state.answers.obs3 === 1) unlockNext(); else lockNext();
                    break;

                case 5:
                    html = `
                        <div class="fade-in space-y-6 pb-10">
                            <h2 class="text-xl font-bold text-blue-800 border-b pb-2 border-blue-100 flex items-center">
                                🧠 EM HÃY SUY LUẬN
                            </h2>
                            
                            <div class="bg-white p-4 rounded border shadow-sm">
                                <p class="font-semibold text-gray-800 mb-3">1. Dựa vào hiện tượng, dự đoán chất rắn trắng tạo thành là chất nào?</p>
                                <div class="grid grid-cols-2 gap-2">
                                    ${['BaSO₄', 'NaCl', 'NaOH', 'H₂SO₄'].map((opt, i) => `
                                        <button onclick="handleEx(1, ${i})" class="p-2 border rounded font-semibold text-center hover:bg-blue-50 transition-colors ${(state.answers.ex1===i)?'bg-blue-600 text-white border-blue-600':''}">
                                            ${opt}
                                        </button>
                                    `).join('')}
                                </div>
                                <div id="feedback-ex1" class="text-sm mt-2 font-semibold"></div>
                            </div>

                            <div class="bg-white p-4 rounded border shadow-sm">
                                <p class="font-semibold text-gray-800 mb-2">2. Hãy chọn phương trình hóa học dạng phân tử đúng:</p>
                                <div class="space-y-2">
                                    ${[
                                        'Na₂SO₄ + BaCl₂ → BaSO₄↓ + 2NaCl',
                                        'Na₂SO₄ + BaCl₂ → BaSO₃↓ + 2NaCl',
                                        'Na₂SO₄ + BaCl₂ → Ba(OH)₂↓ + 2NaCl',
                                        '2Na₂SO₄ + BaCl₂ → Ba(SO₄)₂↓ + 4NaCl'
                                    ].map((opt, i) => `
                                        <label class="flex items-center p-2 border rounded cursor-pointer hover:bg-blue-50 ${(state.answers.ex2===i) ? 'bg-blue-100 border-blue-500' : ''}">
                                            <input type="radio" name="q2" class="mr-3" ${(state.answers.ex2===i) ? 'checked' : ''} onchange="handleEx(2, ${i})">
                                            <span class="font-mono text-sm">${opt}</span>
                                        </label>
                                    `).join('')}
                                </div>
                                <div id="feedback-ex2" class="text-sm mt-2 font-semibold"></div>
                            </div>

                            <div class="bg-white p-4 rounded border shadow-sm">
                                <p class="font-semibold text-gray-800 mb-2">3. Hãy chọn phương trình ion rút gọn đúng:</p>
                                <div class="space-y-2">
                                    ${[
                                        'Ba²⁺ + SO₄²⁻ → BaSO₄↓',
                                        'Na⁺ + Cl⁻ → NaCl',
                                        'Ba²⁺ + 2Cl⁻ → BaCl₂↓',
                                        '2Na⁺ + SO₄²⁻ → Na₂SO₄↓'
                                    ].map((opt, i) => `
                                        <label class="flex items-center p-2 border rounded cursor-pointer hover:bg-blue-50 ${(state.answers.ex3===i) ? 'bg-blue-100 border-blue-500' : ''}">
                                            <input type="radio" name="q3" class="mr-3" ${(state.answers.ex3===i) ? 'checked' : ''} onchange="handleEx(3, ${i})">
                                            <span class="font-mono text-sm">${opt}</span>
                                        </label>
                                    `).join('')}
                                </div>
                                <div id="feedback-ex3" class="text-sm mt-2 font-semibold"></div>
                            </div>

                            <div class="bg-blue-50 p-4 rounded border border-blue-200 shadow-sm">
                                <p class="font-semibold text-blue-900 mb-3">4. 🔬 Thử thách: Nếu thay Na₂SO₄ bằng H₂SO₄ loãng rồi nhỏ BaCl₂, hiện tượng gì sẽ xảy ra?</p>
                                <div class="space-y-2 mb-3">
                                    ${['Không có hiện tượng', 'Xuất hiện kết tủa trắng BaSO₄', 'Xuất hiện khí', 'Dung dịch hóa xanh'].map((opt, i) => `
                                        <label class="flex items-center p-2 border rounded bg-white cursor-pointer hover:bg-gray-50 ${(state.answers.ex4===i)?'border-blue-500 bg-blue-50 ring-1 ring-blue-500':''}">
                                            <input type="radio" name="ex4_rad" class="mr-2" ${(state.answers.ex4===i) ? 'checked' : ''} onchange="handleEx(4, ${i})">
                                            <span class="text-sm">${opt}</span>
                                        </label>
                                    `).join('')}
                                </div>
                                <div id="feedback-ex4" class="text-sm mt-2 font-semibold mb-4"></div>

                                <p class="font-semibold text-blue-900 mb-2">5. Giải thích tại sao có hiện tượng trên?</p>
                                <div class="space-y-2">
                                    ${[
                                        'Vì H₂SO₄ loãng cũng cung cấp ion SO₄²⁻ tạo kết tủa với Ba²⁺.',
                                        'Vì H₂SO₄ loãng tác dụng với BaCl₂ sinh ra khí bay lên.',
                                        'Vì môi trường acid làm dung dịch BaCl₂ bị mất màu.',
                                        'Vì phản ứng sinh ra kết tủa BaCl₂ không tan.'
                                    ].map((opt, i) => `
                                        <label class="flex items-center p-2 border rounded bg-white cursor-pointer hover:bg-gray-50 ${(state.answers.ex5===i) ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : ''}">
                                            <input type="radio" name="q5" class="mr-3" ${(state.answers.ex5===i) ? 'checked' : ''} onchange="handleEx(5, ${i})">
                                            <span class="text-sm">${opt}</span>
                                        </label>
                                    `).join('')}
                                </div>
                                <div id="feedback-ex5" class="text-sm mt-2 font-semibold"></div>
                            </div>
                        </div>`;
                    DOM.btnAction.onclick = nextStep;
                    DOM.btnAction.innerText = "Tới phần Kết luận";
                    checkAllEx();
                    break;

                case 6:
                    html = `
                        <div class="fade-in text-center py-6">
                            <div class="text-5xl mb-4">🎯</div>
                            <h2 class="text-2xl font-bold text-blue-800 mb-2">KẾT LUẬN CỦA EM</h2>
                            <p class="text-gray-600 mb-6">Hãy chọn các đáp án đúng để hoàn thiện câu kết luận sau:</p>
                            
                            <div class="bg-green-50 p-4 md:p-6 rounded-xl border border-green-200 inline-block text-left max-w-lg shadow-inner leading-loose text-base text-gray-800 w-full">
                                Để nhận biết ion <strong>SO₄²⁻</strong>, thuốc thử thường dùng là dung dịch chứa ion 
                                <select id="sel-concl1" class="border border-green-500 rounded p-1 mx-1 font-bold text-green-700 bg-white outline-none cursor-pointer hover:bg-green-100" onchange="checkConcl()">
                                    <option value="">-- Chọn ion --</option>
                                    <option value="Ba2+">Ba²⁺</option>
                                    <option value="Na+">Na⁺</option>
                                    <option value="Cl-">Cl⁻</option>
                                </select>.<br>
                                Hiện tượng đặc trưng là tạo ra 
                                <select id="sel-concl2" class="border border-green-500 rounded p-1 mx-1 font-bold text-green-700 bg-white outline-none cursor-pointer hover:bg-green-100 mt-2 sm:mt-0" onchange="checkConcl()">
                                    <option value="">-- Chọn hiện tượng --</option>
                                    <option value="khi">chất khí bay lên</option>
                                    <option value="kettua">kết tủa trắng</option>
                                    <option value="doimau">dung dịch hóa xanh</option>
                                </select> không tan trong acid.<br>
                                <div class="mt-3 flex flex-col sm:flex-row sm:items-center">
                                    <span class="whitespace-nowrap mr-2">PT ion rút gọn:</span>
                                    <select id="sel-concl3" class="border border-green-500 rounded p-1 font-mono font-bold text-green-700 bg-white outline-none cursor-pointer hover:bg-green-100 w-full mt-1 sm:mt-0" onchange="checkConcl()">
                                        <option value="">-- Chọn phương trình --</option>
                                        <option value="dung">Ba²⁺ + SO₄²⁻ → BaSO₄↓</option>
                                        <option value="sai1">Na⁺ + Cl⁻ → NaCl</option>
                                        <option value="sai2">Ba²⁺ + 2Cl⁻ → BaCl₂↓</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div id="final-msg" class="mt-6 text-xl font-bold text-blue-600 hidden">
                                🎉 XUẤT SẮC! EM ĐÃ HOÀN THÀNH BÀI HỌC!
                            </div>
                        </div>`;
                    DOM.btnAction.classList.add('hidden');
                    setTimeout(checkConcl, 100);
                    break;
            }
            DOM.taskPanel.innerHTML = html;
        };

        const checkObs = () => {
            if (state.answers.obs3 === 1) {
                unlockNext();
                showMsg("Chính xác! Hiện tượng là kết tủa trắng.");
            } else {
                lockNext();
                showMsg("Chưa chính xác. Em hãy nhìn kỹ lại ống nghiệm xem có bọt khí hay chất rắn lơ lửng không?", true);
            }
        };

        window.handleEx = (qNum, idx) => {
            state.answers[`ex${qNum}`] = idx;
            renderTaskPanel(); 
            const fb = document.getElementById(`feedback-ex${qNum}`);
            let isCorrect = false;
            
            if (qNum === 1 && idx === 0) isCorrect = true; 
            if (qNum === 2 && idx === 0) isCorrect = true; 
            if (qNum === 3 && idx === 0) isCorrect = true; 
            if (qNum === 4 && idx === 1) isCorrect = true; 
            if (qNum === 5 && idx === 0) isCorrect = true; 
            
            if (isCorrect) {
                fb.innerHTML = "<span class='text-green-600'>✓ Chính xác!</span>";
            } else {
                fb.innerHTML = "<span class='text-red-600'>✗ Sai. Hãy xem lại kiến thức về ion tạo kết tủa.</span>";
            }
            checkAllEx();
        };

        const checkAllEx = () => {
            if (state.answers.ex1 === 0 && state.answers.ex2 === 0 && state.answers.ex3 === 0 && state.answers.ex4 === 1 && state.answers.ex5 === 0) {
                unlockNext();
            } else {
                lockNext();
            }
        };

        window.checkConcl = () => {
            if (!document.getElementById('sel-concl1')) return;
            
            const v1 = document.getElementById('sel-concl1').value === 'Ba2+';
            const v2 = document.getElementById('sel-concl2').value === 'kettua';
            const v3 = document.getElementById('sel-concl3').value === 'dung';

            document.getElementById('sel-concl1').classList.toggle('bg-green-200', v1 && document.getElementById('sel-concl1').value !== "");
            document.getElementById('sel-concl2').classList.toggle('bg-green-200', v2 && document.getElementById('sel-concl2').value !== "");
            document.getElementById('sel-concl3').classList.toggle('bg-green-200', v3 && document.getElementById('sel-concl3').value !== "");

            if (v1 && v2 && v3) {
                document.getElementById('final-msg').classList.remove('hidden');
            } else {
                document.getElementById('final-msg').classList.add('hidden');
            }
        };

        const unlockNext = () => {
            DOM.btnAction.disabled = false;
            DOM.btnAction.classList.remove('opacity-50', 'cursor-not-allowed');
            DOM.btnAction.classList.add('animate-bounce');
            setTimeout(() => DOM.btnAction.classList.remove('animate-bounce'), 1000);
        };

        const lockNext = () => {
            DOM.btnAction.disabled = true;
            DOM.btnAction.classList.add('opacity-50', 'cursor-not-allowed');
        };

        const nextStep = () => {
            if (state.step < STEPS.length) {
                state.step++;
                state.selectedTool = null;
                updateToolUI();
                renderProgress();
                renderTaskPanel();
                if(state.step < 5) DOM.btnAction.innerText = "Tiếp tục";
            }
        };

        const retryStep = () => {
            state.selectedTool = null;
            if (state.step === 1) {
                DOM.tube.liquid.setAttribute('height', '0');
                DOM.tube.liquid.setAttribute('y', '238');
                state.tubeState = 'empty';
            } else if (state.step === 2) {
                DOM.tube.cloudy.style.opacity = '0';
                DOM.tube.precipGroup.innerHTML = '';
                DOM.tube.precipGroup.setAttribute('opacity', '0');
                document.getElementById('settled-precipitate').style.opacity = '0';
                state.tubeState = 'na2so4';
            } else if (state.step === 3) {
                DOM.tube.cloudy.style.opacity = '0.9';
                document.getElementById('settled-precipitate').style.opacity = '0';
                
                const circles = DOM.tube.precipGroup.querySelectorAll('circle');
                circles.forEach(c => {
                    c.classList.remove('anim-settle');
                });
                state.tubeState = 'reacting';
            }
            updateToolUI();
            renderTaskPanel();
            showMsg("Đã đặt lại thao tác bước này.");
        };

        const resetExperiment = () => {
            state = {
                step: 1,
                speed: state.speed,
                selectedTool: null,
                tubeState: 'empty',
                answers: {
                    obs1: null, obs2: null, obs3: null,
                    ex1: null, ex2: null, ex3: null, ex4: null, ex5: null,
                    concl1: "", concl2: "", concl3: ""
                }
            };
            
            DOM.tube.liquid.setAttribute('height', '0');
            DOM.tube.liquid.setAttribute('y', '238');
            DOM.tube.cloudy.style.opacity = '0';
            DOM.tube.precipGroup.innerHTML = '';
            DOM.tube.precipGroup.setAttribute('opacity', '0');
            document.getElementById('settled-precipitate').style.opacity = '0';
            DOM.tube.svg.classList.remove('anim-shake');
            
            DOM.tube.pipette.classList.add('hidden');
            DOM.tube.pipette.style.transform = 'translate(-50%, -90px)';
            DOM.tube.drops.classList.add('hidden');
            DOM.tube.drops.innerHTML = '';
            
            updateToolUI();
            renderProgress();
            renderTaskPanel();
            showMsg("Đã tạo mới lại toàn bộ thí nghiệm.");
        };

        window.onload = () => {
            renderProgress();
            renderTaskPanel();
            updateToolUI();
        };
    </script>
</body>
</html>
